<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .canvas {
    position: relative;
    width: 1024px;
    height: 500px;
    background:
      radial-gradient(circle at 82% 12%, rgba(160, 216, 216, 0.16), transparent 40%),
      radial-gradient(circle at 8% 92%, rgba(230, 57, 70, 0.14), transparent 42%),
      linear-gradient(135deg, #0b1526 0%, #121f36 45%, #1d3557 100%);
    overflow: hidden;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(241, 250, 238, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(241, 250, 238, 0.045) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .icon {
    position: absolute;
    left: 68px;
    top: 50%;
    transform: translateY(-50%);
    width: 220px;
    height: 220px;
    border-radius: 48px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(241, 250, 238, 0.08);
  }
  .content {
    position: absolute;
    left: 350px;
    top: 50%;
    transform: translateY(-50%);
    right: 56px;
  }
  .wordmark {
    font-size: 68px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #f1faee;
    line-height: 1;
  }
  .wordmark .dot { color: #a8dadc; }
  .tagline {
    margin-top: 18px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 21px;
    color: #c9d6e3;
    letter-spacing: 0.2px;
  }
  .pills {
    margin-top: 34px;
    display: flex;
    gap: 16px;
  }
  .pill {
    font-family: "Consolas", "Courier New", monospace;
    font-size: 16px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pill.owed {
    background: rgba(168, 218, 216, 0.12);
    border: 1px solid rgba(168, 218, 216, 0.45);
    color: #a8dadc;
  }
  .pill.owe {
    background: rgba(230, 57, 70, 0.14);
    border: 1px solid rgba(230, 57, 70, 0.55);
    color: #ff8b93;
  }
  .currencies {
    margin-top: 26px;
    font-family: "Consolas", "Courier New", monospace;
    font-size: 14px;
    letter-spacing: 3px;
    color: rgba(241, 250, 238, 0.4);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"></div>
    <img class="icon" src="icon-512.png">
    <div class="content">
      <div class="wordmark">Debt<span class="dot">•</span>Tracker</div>
      <div class="tagline">Хто винен вам і кому винні ви</div>
      <div class="pills">
        <div class="pill owed">▲ МЕНІ ВИННІ</div>
        <div class="pill owe">▼ Я ВИНЕН</div>
      </div>
      <div class="currencies">UAH&nbsp;&nbsp;·&nbsp;&nbsp;USD&nbsp;&nbsp;·&nbsp;&nbsp;PLN&nbsp;&nbsp;·&nbsp;&nbsp;EUR</div>
    </div>
  </div>
</body>
</html>
