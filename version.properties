# Single source of truth for the app version across all targets (Android, Desktop, Web, iOS).
# Read by androidApp/build.gradle.kts, desktopApp/build.gradle.kts and sharedUI/build.gradle.kts
# (the latter exposes it to all Compose targets, including iOS, via BuildConfig.APP_VERSION).
#
# Bump VERSION_CODE only — the build scripts substitute it into VERSION_NAME's `$VERSION_CODE`
# placeholder (java.util.Properties itself does no interpolation).
# 23

VERSION_CODE=64
VERSION_NAME=1.0.$VERSION_CODE
