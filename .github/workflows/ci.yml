name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile all targets
        # Each app module pulls in sharedUI for its own platform(s) transitively
        # (android/jvm/js/wasmJs) — iOS isn't compiled here, no macOS runner in this job.
        run: |
          ./gradlew \
            :androidApp:compileDebugKotlin \
            :desktopApp:compileKotlin \
            :webApp:compileKotlinJs \
            :webApp:compileKotlinWasmJs \
            --stacktrace

      - name: Unit tests (JVM)
        run: ./gradlew :sharedUI:jvmTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: sharedUI/build/reports/tests
          if-no-files-found: ignore
