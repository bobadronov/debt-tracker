
name: Release

# Tag-triggered packaging: pushing a `v*` tag, or running this manually.
#
# Builds:
#   - Android APK
#   - Android App Bundle (.aab, for Google Play)
#   - Windows .msi
#   - Linux .deb
#   - Web build
#
# Then, ONLY if every platform build above succeeded (all-or-nothing — a single
# failed build publishes nothing anywhere):
#   - uploads the .aab to Google Play (play-store job — also needs the
#     GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret, see below), and only if THAT
#     succeeds:
#   - publishes APK/.msi/.deb as a GitHub Release (the .aab is Play-Store-only —
#     it's not directly installable, so it isn't attached to the release page)
#   - deploys the web build to GitHub Pages
#
# Google Play publishing prerequisites (one-time, done by a human — the Play
# Developer API cannot create an app or do its very first release):
#   1. Manually create the app in Play Console and upload one .aab by hand
#      (Internal testing track is fine) — see play-store-listing.md §5.
#   2. In Google Cloud Console, create a service account, enable the "Google
#      Play Android Developer API", and download a JSON key for it.
#   3. In Play Console → Users and permissions, invite that service account
#      email and grant it release permissions for this app.
#   4. Add the JSON key's contents as the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#      repo secret. Once set, this workflow uploads the .aab automatically
#      on every tagged release.
#
# Windows code signing (optional — without it the build still succeeds and
# produces an unsigned installer that SmartScreen flags as "unknown publisher"
# and Smart App Control blocks outright). Uses Azure Trusted Signing — see the
# windows-msi job's env block for the one-time Azure setup and the six
# AZURE_* repo secrets that switch it on.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (for example v1.0.0)'
        required: true
        type: string
      play_track:
        description: 'Google Play track to publish to'
        required: false
        type: choice
        default: production
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The anon key is intentionally public. RLS protects the data, not the key.
  # See debt-tracker-start-prompt.md §8 (Configuration & secrets).
  #
  # Both values are required by sharedUI/build.gradle.kts during Gradle
  # configuration because they are used by the BuildConfig block.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  # Web OAuth client ID for "Sign in with Google" (public value). Required at Gradle
  # configuration time by sharedUI/build.gradle.kts's BuildConfig block, same as the two above.
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

jobs:

  # ============================================================
  # Android APK
  # ============================================================
  android-apk:
    runs-on: ubuntu-latest

    env:
      # Optional Android signing configuration.
      #
      # If ANDROID_KEYSTORE_BASE64 is not configured, the build
      # continues and produces an unsigned APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets). Gradle's own dependency-download retry does not
      # cover 429, so wrap the whole invocation.
      - name: Build release APK
        shell: bash
        run: |
          n=0
          until ./gradlew :androidApp:assembleRelease --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error


  # ============================================================
  # Android App Bundle (.aab) — for Google Play Console upload
  # ============================================================
  android-aab:
    runs-on: ubuntu-latest

    env:
      # Same optional signing config as android-apk — if unset, the build
      # continues and produces an unsigned bundle (Play Console will reject
      # an unsigned upload, but this still lets the workflow succeed).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Retry on transient Maven Central failures — see the APK job above.
      - name: Build release App Bundle
        shell: bash
        run: |
          n=0
          until ./gradlew :androidApp:bundleRelease --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # R8 obfuscates the release bundle — ship the mapping so Play Console can
      # de-obfuscate crash stack traces (see `optimization { enable = true }` in androidApp/build.gradle.kts).
      # mapping.txt is consumed as-is by the play-store job; the other three (seeds/usage/
      # configuration) are the rest of the R8 shrink report. This artifact is kept for
      # download from the workflow run but is not attached to the GitHub Release.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-mapping
          path: |
            androidApp/build/outputs/mapping/release/mapping.txt
            androidApp/build/outputs/mapping/release/seeds.txt
            androidApp/build/outputs/mapping/release/usage.txt
            androidApp/build/outputs/mapping/release/configuration.txt
          if-no-files-found: error


  # ============================================================
  # Google Play — upload the .aab
  #
  # The upload step is skipped (via its own `if:`) until
  # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is configured as a repo secret. See the
  # prerequisites in the comment block at the top of this file and
  # play-store-listing.md §5.
  #
  # Note: the `secrets` context isn't recognized inside ANY `if:` expression
  # (job- or step-level) — GitHub Actions rejects the whole workflow file if
  # it's referenced there. The documented workaround is to copy the secret
  # into an `env:` var first and gate on `env.*` instead, since `env` (unlike
  # `secrets`) is a valid context inside `if:`.
  #
  # All-or-nothing release: this waits for EVERY platform build to pass before
  # touching Google Play, and `github-release` + `deploy-pages` in turn wait for
  # this. So a failure in any single build (or in the Play upload itself) leaves
  # nothing published anywhere — no GitHub Release, no Pages deploy, no Play
  # upload — rather than a half-shipped release across platforms.
  # ============================================================
  play-store:
    needs:
      - android-apk
      - android-aab
      - windows-msi
      - linux-deb
      - web

    runs-on: ubuntu-latest

    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: debt-tracker-aab
          path: aab

      - name: Download R8 mapping
        uses: actions/download-artifact@v4
        with:
          name: debt-tracker-mapping
          path: mapping

      - name: Upload to Google Play
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bigblackowl.debttracker.androidApp
          releaseFiles: aab/*.aab
          mappingFile: mapping/mapping.txt
          track: ${{ inputs.play_track || 'production' }}


  # ============================================================
  # Windows MSI
  # ============================================================
  windows-msi:
    runs-on: windows-latest

    env:
      # Azure Trusted Signing — Microsoft's signing service. This is the path
      # that satisfies Windows Smart App Control; a fresh standalone OV cert
      # does not (no reputation). If AZURE_TS_ACCOUNT is unset the build still
      # succeeds and produces an UNSIGNED installer (SmartScreen "unknown
      # publisher"; Smart App Control blocks it outright).
      #
      # To enable, add these repo secrets (one-time Azure setup: create a
      # Trusted Signing account + a public-trust certificate profile — identity
      # validation takes ~1-5 business days — then an App Registration granted
      # the "Trusted Signing Certificate Profile Signer" role on the account):
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  — that App Registration
      #   AZURE_TS_ENDPOINT  — account endpoint, e.g. https://weu.codesigning.azure.net/ (your region)
      #   AZURE_TS_ACCOUNT   — Trusted Signing account name
      #   AZURE_TS_PROFILE   — certificate profile name
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
      AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
      AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does not
      # cover 429.
      - name: Build app image
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:createDistributable --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      # Several bundled libraries (Nucleus's Tao windowing + decorations, JNA,
      # ComposeNativeTray, Room's SQLite) ship their Windows .dll INSIDE their
      # jar and extract it, unsigned, to %LOCALAPPDATA% at first run — where
      # Smart App Control then blocks it. So pull every .dll out of the jars in
      # the app image, sign them, and put them back before the loose-file pass.
      - name: Extract bundled native DLLs for signing
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'desktopApp\build\compose\binaries\main\app\Debt Tracker\app'
          $stage  = Join-Path $env:RUNNER_TEMP 'jar-dlls'
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          $total = 0
          Get-ChildItem -Path $appDir -Filter *.jar | ForEach-Object {
            $jarName = $_.Name
            $zip = [System.IO.Compression.ZipFile]::OpenRead($_.FullName)
            try {
              foreach ($entry in $zip.Entries) {
                if ($entry.FullName -like '*.dll') {
                  $dest = Join-Path $stage (Join-Path $jarName ($entry.FullName -replace '/', '\'))
                  New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dest, $true)
                  $total++
                }
              }
            } finally { $zip.Dispose() }
          }
          Write-Host "Staged $total native DLL(s) from bundled jars"
          if ($total -eq 0) { throw 'No DLLs found in bundled jars - app image layout changed?' }

      - name: Sign bundled native DLLs (Azure Trusted Signing)
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ env.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_TS_PROFILE }}
          files-folder: ${{ runner.temp }}\jar-dlls
          files-folder-filter: dll
          files-folder-recurse: true
          description: Debt Tracker
          description-url: https://bobadronov.github.io/debt-tracker/

      # Use the JDK `jar` tool (on PATH via setup-java), not .NET ZipArchive —
      # the latter's Update mode rewrites directory entries in a way Info-ZIP
      # and some scanners flag as corrupt.
      - name: Repack signed DLLs into bundled jars
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:GITHUB_WORKSPACE 'desktopApp\build\compose\binaries\main\app\Debt Tracker\app'
          $stage  = Join-Path $env:RUNNER_TEMP 'jar-dlls'
          $count = 0
          Get-ChildItem -Path $stage -Directory | ForEach-Object {
            $jarPath = Join-Path $appDir $_.Name
            if (-not (Test-Path $jarPath)) { throw "jar not found: $jarPath" }
            & jar --update --file $jarPath -C $_.FullName .
            if ($LASTEXITCODE -ne 0) { throw "jar --update failed for $($_.Name): exit $LASTEXITCODE" }
            $count += (Get-ChildItem $_.FullName -Recurse -File | Measure-Object).Count
          }
          Write-Host "Repacked $count signed DLL(s) into bundled jars"

      # Smart App Control checks the launched .exe, not the installer, so every
      # loose binary in the app image (Debt Tracker.exe + the bundled JRE's .dll
      # files) must be signed BEFORE it's wrapped in the MSI.
      - name: Sign app binaries (Azure Trusted Signing)
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ env.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\desktopApp\build\compose\binaries\main\app\Debt Tracker
          files-folder-filter: exe,dll
          files-folder-recurse: true
          description: Debt Tracker
          description-url: https://bobadronov.github.io/debt-tracker/

      # Gradle's packageMsi rebuilds the app image straight from the dependency
      # cache (it doesn't consume createDistributable's output), so it would
      # bypass every signature applied above. When signing is on, wrap the
      # already-signed app image with jpackage directly instead; the runner
      # ships WiX 3.14, which JDK 17's jpackage supports.
      - name: Package Windows installer (signed app image)
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wixBin = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset*\bin\light.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $wixBin) { throw 'WiX toolset not found on runner' }
          $env:PATH = "$wixBin;$env:PATH"
          $ver = (Select-String -Path version.properties -Pattern '^VERSION_NAME=(.+)$').Matches[0].Groups[1].Value
          $img  = Join-Path $env:GITHUB_WORKSPACE 'desktopApp\build\compose\binaries\main\app\Debt Tracker'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'desktopApp\build\compose\binaries\main\msi'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type msi --app-image $img --dest $dest `
            --name 'Debt Tracker' --app-version $ver `
            --win-shortcut `
            --win-upgrade-uuid '7b9d5c61-9805-50a2-a4da-3033c222b695' `
            --icon (Join-Path $env:GITHUB_WORKSPACE 'desktopApp\src\main\resources\appIcons\WindowsIcon.ico')
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed: exit $LASTEXITCODE" }

      - name: Package Windows installer (unsigned)
        if: ${{ env.AZURE_TS_ACCOUNT == '' }}
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:packageMsi -x createDistributable --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Sign installer (Azure Trusted Signing)
        if: ${{ env.AZURE_TS_ACCOUNT != '' }}
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ env.AZURE_TENANT_ID }}
          azure-client-id: ${{ env.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ env.AZURE_CLIENT_SECRET }}
          endpoint: ${{ env.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ env.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ env.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\desktopApp\build\compose\binaries\main\msi
          files-folder-filter: msi
          description: Debt Tracker
          description-url: https://bobadronov.github.io/debt-tracker/

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error


  # ============================================================
  # Linux DEB
  # ============================================================
  linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does not
      # cover 429. This job has hit 429 on filekit-dialogs-compose before.
      - name: Package Debian package
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:packageDeb --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error


  # ============================================================
  # Web
  # ============================================================
  web:
    # wasm-opt/Binaryen currently crashes on the Ubuntu runner
    # for this project's wasmJs production optimization.
    #
    # Windows avoids the problematic Binaryen binary.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        # Kotlin/JS's first webpack invocation in a fresh checkout can fail with
        # "Cannot find node module ... webpack/bin/webpack.js" — a known Kotlin/JS
        # Gradle plugin race where npm modules are still being materialized. A
        # second invocation in the same environment (modules now on disk) succeeds.
        # See https://discuss.kotlinlang.org/t/webpack-issues-on-a-gradle-kotlin-js-project/16470
        shell: bash
        run: |
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace ||
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace

      - name: Add legal pages (privacy policy, for Play Store etc.)
        shell: bash
        run: cp legal/*.html webApp/build/dist/composeWebCompatibility/productionExecutable/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable


  # ============================================================
  # Deploy GitHub Pages
  # ============================================================
  deploy-pages:
    # Publish the web build only once every platform built AND the Play upload
    # went through — see the all-or-nothing note on the play-store job.
    needs:
      - android-apk
      - android-aab
      - windows-msi
      - linux-deb
      - web
      - play-store

    runs-on: ubuntu-latest

    # Shared with deploy-pages.yml so the two workflows can't deploy Pages
    # concurrently and clobber each other.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GitHub Release
  # ============================================================
  github-release:
    # Cut the GitHub Release only once every platform built AND the Play upload
    # went through — see the all-or-nothing note on the play-store job.
    needs:
      - android-apk
      - android-aab
      - windows-msi
      - linux-deb
      - web
      - play-store

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The R8/ProGuard mapping + shrink report are intentionally NOT attached to the
      # GitHub Release. They still reach Play Console via the play-store job, and stay
      # downloadable from this run's `debt-tracker-mapping` workflow artifact for
      # de-obfuscating a crash stack trace later (retrace -m mapping.txt).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/debt-tracker-apk/*.apk
            artifacts/debt-tracker-msi/*.msi
            artifacts/debt-tracker-deb/*.deb
