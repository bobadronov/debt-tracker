name: Release

# Tag-triggered packaging: pushing a `v*` tag (or running this manually)
# builds the Android APK, Windows .exe, Linux .deb, and the web build, then
# publishes them as a GitHub Release + deploys the web build to GitHub Pages.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Anon key is intentionally public (RLS protects data, not the key) — see STEPS.md Phase 0.
  # Both are required at Gradle configuration time by sharedUI/build.gradle.kts's buildConfig block.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Optional: only set up if the ANDROID_KEYSTORE_BASE64 secret exists (see STEPS.md).
      # Without it, assembleRelease still succeeds and just produces an unsigned APK.
      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-apk
          path: androidApp/build/outputs/apk/release/*.apk

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # Compose Desktop's Gradle plugin downloads WiX Toolset itself on first
      # use (downloadWix/unzipWix tasks) — no manual install needed.
      - name: Package .exe
        run: ./gradlew :desktopApp:packageExe --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # jpackage needs fakeroot/dpkg-deb to build .deb packages on Linux.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Package .deb
        run: ./gradlew :desktopApp:packageDeb --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  web:
    # ubuntu-latest's Binaryen wasm-opt binary crashes with SIGSEGV during
    # the wasmJs production optimize step on GitHub-hosted Linux runners
    # (confirmed: same Gradle task builds successfully on Windows). Using
    # windows-latest sidesteps the buggy Linux binaryen binary.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        run: ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable

  deploy-pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  github-release:
    needs: [android-apk, windows-exe, linux-deb, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/debt-tracker-apk/*.apk
            artifacts/debt-tracker-exe/*.exe
            artifacts/debt-tracker-deb/*.deb
