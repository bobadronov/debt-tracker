
name: Release

# Tag-triggered packaging: pushing a `v*` tag, or running this manually.
#
# Builds:
#   - Android APK
#   - Android App Bundle (.aab, for Google Play)
#   - Windows .exe
#   - Linux .deb
#   - Web build
#
# Then:
#   - publishes APK/.aab/.exe/.deb as a GitHub Release
#   - deploys the web build to GitHub Pages
#   - uploads the .aab to Google Play (play-store job — only runs once the
#     GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is configured, see below)
#
# Google Play publishing prerequisites (one-time, done by a human — the Play
# Developer API cannot create an app or do its very first release):
#   1. Manually create the app in Play Console and upload one .aab by hand
#      (Internal testing track is fine) — see play-store-listing.md §5.
#   2. In Google Cloud Console, create a service account, enable the "Google
#      Play Android Developer API", and download a JSON key for it.
#   3. In Play Console → Users and permissions, invite that service account
#      email and grant it release permissions for this app.
#   4. Add the JSON key's contents as the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#      repo secret. Once set, this workflow uploads the .aab automatically
#      on every tagged release.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (for example v1.0.0)'
        required: true
        type: string
      play_track:
        description: 'Google Play track to publish to'
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The anon key is intentionally public. RLS protects the data, not the key.
  # See debt-tracker-start-prompt.md §8 (Configuration & secrets).
  #
  # Both values are required by sharedUI/build.gradle.kts during Gradle
  # configuration because they are used by the BuildConfig block.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:

  # ============================================================
  # Android APK
  # ============================================================
  android-apk:
    runs-on: ubuntu-latest

    env:
      # Optional Android signing configuration.
      #
      # If ANDROID_KEYSTORE_BASE64 is not configured, the build
      # continues and produces an unsigned APK.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error


  # ============================================================
  # Android App Bundle (.aab) — for Google Play Console upload
  # ============================================================
  android-aab:
    runs-on: ubuntu-latest

    env:
      # Same optional signing config as android-apk — if unset, the build
      # continues and produces an unsigned bundle (Play Console will reject
      # an unsigned upload, but this still lets the workflow succeed).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release App Bundle
        run: ./gradlew :androidApp:bundleRelease --stacktrace

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error


  # ============================================================
  # Google Play — upload the .aab
  #
  # Skipped entirely (via the `if:`) until GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
  # is configured as a repo secret. See the prerequisites in the comment
  # block at the top of this file and play-store-listing.md §5.
  # ============================================================
  play-store:
    needs: android-aab
    if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}

    runs-on: ubuntu-latest

    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: debt-tracker-aab
          path: aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bigblackowl.debttracker.androidApp
          releaseFiles: aab/*.aab
          track: ${{ inputs.play_track || 'internal' }}


  # ============================================================
  # Windows EXE
  # ============================================================
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compose Desktop downloads WiX Toolset automatically when
      # packageExe requires it.
      - name: Package Windows executable
        run: ./gradlew :desktopApp:packageExe --stacktrace

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-exe
          path: desktopApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error


  # ============================================================
  # Linux DEB
  # ============================================================
  linux-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Package Debian package
        run: ./gradlew :desktopApp:packageDeb --stacktrace

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error


  # ============================================================
  # Web
  # ============================================================
  web:
    # wasm-opt/Binaryen currently crashes on the Ubuntu runner
    # for this project's wasmJs production optimization.
    #
    # Windows avoids the problematic Binaryen binary.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        # Kotlin/JS's first webpack invocation in a fresh checkout can fail with
        # "Cannot find node module ... webpack/bin/webpack.js" — a known Kotlin/JS
        # Gradle plugin race where npm modules are still being materialized. A
        # second invocation in the same environment (modules now on disk) succeeds.
        # See https://discuss.kotlinlang.org/t/webpack-issues-on-a-gradle-kotlin-js-project/16470
        shell: bash
        run: |
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace ||
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace

      - name: Add legal pages (privacy policy, for Play Store etc.)
        shell: bash
        run: cp legal/*.html webApp/build/dist/composeWebCompatibility/productionExecutable/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable


  # ============================================================
  # Deploy GitHub Pages
  # ============================================================
  deploy-pages:
    needs: web

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GitHub Release
  # ============================================================
  github-release:
    needs:
      - android-apk
      - android-aab
      - windows-exe
      - linux-deb

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/debt-tracker-apk/*.apk
            artifacts/debt-tracker-aab/*.aab
            artifacts/debt-tracker-exe/*.exe
            artifacts/debt-tracker-deb/*.deb
