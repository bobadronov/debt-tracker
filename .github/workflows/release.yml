
name: Release

# Tag-triggered packaging: pushing a `v*` tag, or running this manually.
#
# Builds:
#   - Android App Bundle (.aab, for Google Play)
#   - Windows .msi
#   - Linux .deb
#   - macOS .dmg (Intel x64 + Apple Silicon arm64)
#   - Web build
#
# Then, ONLY if every platform build above succeeded (all-or-nothing — a single
# failed build publishes nothing anywhere):
#   - uploads the .aab to Google Play (play-store job — also needs the
#     GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret, see below), and only if THAT
#     succeeds:
#   - publishes the .msi/.deb/.dmg installers as a GitHub Release (Android goes
#     to Google Play via the .aab — no APK on the release page; the .aab isn't
#     directly installable, so it isn't attached either)
#   - deploys the web build to GitHub Pages
#
# The macOS .dmg builds are NOT Apple-signed or notarized — Gatekeeper will
# require the user to allow the app manually.
#
# Google Play publishing prerequisites (one-time, done by a human — the Play
# Developer API cannot create an app or do its very first release):
#   1. Manually create the app in Play Console and upload one .aab by hand
#      (Internal testing track is fine) — see play-store-listing.md §5.
#   2. In Google Cloud Console, create a service account, enable the "Google
#      Play Android Developer API", and download a JSON key for it.
#   3. In Play Console → Users and permissions, invite that service account
#      email and grant it release permissions for this app.
#   4. Add the JSON key's contents as the GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
#      repo secret. Once set, this workflow uploads the .aab automatically
#      on every tagged release.
#
# The Windows installer is NOT code-signed — SmartScreen shows "unknown
# publisher" and Smart App Control blocks it outright.

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (for example v1.0.0)'
        required: true
        type: string
      play_track:
        description: 'Google Play track to publish to'
        required: false
        type: choice
        default: production
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The anon key is intentionally public. RLS protects the data, not the key.
  # See debt-tracker-start-prompt.md §8 (Configuration & secrets).
  #
  # Both values are required by sharedUI/build.gradle.kts during Gradle
  # configuration because they are used by the BuildConfig block.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  # Web OAuth client ID for "Sign in with Google" (public value). Required at Gradle
  # configuration time by sharedUI/build.gradle.kts's BuildConfig block, same as the two above.
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

  # Consistent Gradle behaviour across every runner in this workflow.
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache=true

jobs:

  # ============================================================
  # Android App Bundle (.aab) — for Google Play Console upload
  # ============================================================
  android-aab:
    name: Android AAB
    runs-on: ubuntu-latest

    env:
      # Optional Android signing config — if unset, the build continues and
      # produces an unsigned bundle (Play Console will reject an unsigned
      # upload, but this still lets the workflow succeed).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does
      # not cover 429, so wrap the whole invocation.
      - name: Build release App Bundle
        shell: bash
        run: |
          n=0
          until ./gradlew :androidApp:bundleRelease --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # R8 obfuscates the release bundle — ship the mapping so Play Console can
      # de-obfuscate crash stack traces (see `optimization { enable = true }` in androidApp/build.gradle.kts).
      # mapping.txt is consumed as-is by the play-store job; the other three (seeds/usage/
      # configuration) are the rest of the R8 shrink report. This artifact is kept for
      # download from the workflow run but is not attached to the GitHub Release.
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-mapping
          path: |
            androidApp/build/outputs/mapping/release/mapping.txt
            androidApp/build/outputs/mapping/release/seeds.txt
            androidApp/build/outputs/mapping/release/usage.txt
            androidApp/build/outputs/mapping/release/configuration.txt
          if-no-files-found: error


  # ============================================================
  # Google Play — upload the .aab
  #
  # The upload step is skipped (via its own `if:`) until
  # GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is configured as a repo secret. See the
  # prerequisites in the comment block at the top of this file and
  # play-store-listing.md §5.
  #
  # Note: the `secrets` context isn't recognized inside ANY `if:` expression
  # (job- or step-level) — GitHub Actions rejects the whole workflow file if
  # it's referenced there. The documented workaround is to copy the secret
  # into an `env:` var first and gate on `env.*` instead, since `env` (unlike
  # `secrets`) is a valid context inside `if:`.
  #
  # All-or-nothing release: this waits for EVERY platform build to pass before
  # touching Google Play, and `github-release` + `deploy-pages` in turn wait for
  # this. So a failure in any single build (or in the Play upload itself) leaves
  # nothing published anywhere — no GitHub Release, no Pages deploy, no Play
  # upload — rather than a half-shipped release across platforms.
  # ============================================================
  play-store:
    name: Google Play
    needs:
      - android-aab
      - windows-msi
      - linux-deb
      - macos-dmg
      - web

    runs-on: ubuntu-latest

    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: debt-tracker-aab
          path: aab

      - name: Download R8 mapping
        uses: actions/download-artifact@v4
        with:
          name: debt-tracker-mapping
          path: mapping

      - name: Upload to Google Play
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.bigblackowl.debttracker.androidApp
          releaseFiles: aab/*.aab
          mappingFile: mapping/mapping.txt
          track: ${{ inputs.play_track || 'production' }}


  # ============================================================
  # Windows MSI
  # ============================================================
  windows-msi:
    name: Windows MSI
    # Produces an UNSIGNED installer (SmartScreen shows "unknown publisher";
    # Smart App Control blocks it outright). Code signing is not wired up.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does not
      # cover 429.
      - name: Build app image
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:createDistributable --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Package Windows installer
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:packageMsi -x createDistributable --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error


  # ============================================================
  # Linux DEB
  # ============================================================
  linux-deb:
    name: Linux DEB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does not
      # cover 429. This job has hit 429 on filekit-dialogs-compose before.
      - name: Package Debian package
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:packageDeb --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debt-tracker-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error


  # ============================================================
  # macOS DMG — Intel x64 (macos-13) + Apple Silicon arm64 (macos-14).
  #
  # Not Apple-signed or notarized: Gatekeeper flags the app as from an
  # unidentified developer and the user must allow it by hand.
  # ============================================================
  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
            artifact: debt-tracker-dmg-macos-x64
          - os: macos-14
            arch: arm64
            artifact: debt-tracker-dmg-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Retry on transient Maven Central failures (HTTP 429 Too Many Requests,
      # 5xx, connection resets) — Gradle's own dependency-download retry does not
      # cover 429.
      - name: Package macOS DMG
        shell: bash
        run: |
          n=0
          until ./gradlew :desktopApp:packageDmg --stacktrace; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "All 3 attempts failed" >&2; exit 1; fi
            echo "Attempt $n failed; retrying in $((n * 30))s..." >&2
            sleep $((n * 30))
          done

      # Both arches produce an identically named .dmg, so tag it with the arch
      # before upload or the two release assets would collide.
      - name: Tag DMG with arch
        shell: bash
        run: |
          dir=desktopApp/build/compose/binaries/main/dmg
          dmg=$(find "$dir" -maxdepth 1 -name '*.dmg' -print -quit)
          if [ -z "$dmg" ]; then echo "No .dmg produced" >&2; exit 1; fi
          mv "$dmg" "$dir/$(basename "$dmg" .dmg)-${{ matrix.arch }}.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error


  # ============================================================
  # Web
  # ============================================================
  web:
    name: Web
    # wasm-opt/Binaryen currently crashes on the Ubuntu runner
    # for this project's wasmJs production optimization.
    #
    # Windows avoids the problematic Binaryen binary.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build web distribution
        # Kotlin/JS's first webpack invocation in a fresh checkout can fail with
        # "Cannot find node module ... webpack/bin/webpack.js" — a known Kotlin/JS
        # Gradle plugin race where npm modules are still being materialized. A
        # second invocation in the same environment (modules now on disk) succeeds.
        # See https://discuss.kotlinlang.org/t/webpack-issues-on-a-gradle-kotlin-js-project/16470
        shell: bash
        run: |
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace ||
          ./gradlew :webApp:composeCompatibilityBrowserDistribution --stacktrace

      - name: Add legal pages (privacy policy, for Play Store etc.)
        shell: bash
        run: cp legal/*.html webApp/build/dist/composeWebCompatibility/productionExecutable/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/composeWebCompatibility/productionExecutable


  # ============================================================
  # Deploy GitHub Pages
  # ============================================================
  deploy-pages:
    name: Deploy GitHub Pages
    # Publish the web build only once every platform built AND the Play upload
    # went through — see the all-or-nothing note on the play-store job.
    needs:
      - android-aab
      - windows-msi
      - linux-deb
      - macos-dmg
      - web
      - play-store

    runs-on: ubuntu-latest

    # Shared with deploy-pages.yml so the two workflows can't deploy Pages
    # concurrently and clobber each other.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # GitHub Release
  # ============================================================
  github-release:
    name: GitHub Release
    # Cut the GitHub Release only once every platform built AND the Play upload
    # went through — see the all-or-nothing note on the play-store job.
    needs:
      - android-aab
      - windows-msi
      - linux-deb
      - macos-dmg
      - web
      - play-store

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: release-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v ]]; then
            echo "::error::Release tag must start with 'v' (got '$tag')."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # workflow_dispatch has no tag ref — create and push it so the Release
      # attaches to a real tag. A tag push (the normal path) already has one.
      - name: Create tag if needed
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # Android is distributed through Google Play (the android-aab job uploads the
      # .aab there), so no APK is attached here — the release page points to the
      # Play listing instead. The .msi/.deb are the only installers on the page.
      #
      # The R8/ProGuard mapping + shrink report are intentionally NOT attached to the
      # GitHub Release. They still reach Play Console via the play-store job, and stay
      # downloadable from this run's `debt-tracker-mapping` workflow artifact for
      # de-obfuscating a crash stack trace later (retrace -m mapping.txt).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true
          # Prepended above the auto-generated changelog.
          body: |
            ## Install

            | Platform | Get it |
            |---|---|
            | 🤖 **Android** | [**Google Play**](https://play.google.com/store/apps/details?id=org.bigblackowl.debttracker.androidApp) |
            | 🖥️ **Windows** | `.msi` below |
            | 🐧 **Linux** | `.deb` below |
            | 🍎 **macOS (Intel)** | `x64.dmg` below |
            | 🍎 **macOS (Apple Silicon)** | `arm64.dmg` below |
            | 🌐 **Web** | [bobadronov.github.io/debt-tracker](https://bobadronov.github.io/debt-tracker/) |

            The macOS builds are not Apple-signed or notarized — Gatekeeper
            will ask you to allow the app manually.

            ---
          fail_on_unmatched_files: true
          files: |
            artifacts/debt-tracker-msi/*.msi
            artifacts/debt-tracker-deb/*.deb
            artifacts/debt-tracker-dmg-macos-x64/*.dmg
            artifacts/debt-tracker-dmg-macos-arm64/*.dmg
