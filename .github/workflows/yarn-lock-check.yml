
name: Yarn lock check

# Catches kotlin-js-store/yarn.lock drift *before* it breaks a release.
#
# Root cause: the lock pins resolved versions, but package.json (generated by
# the Kotlin/JS Gradle plugin) declares semver ranges. A fresh resolve against
# the npm registry can pick different transitive versions than what's
# committed — purely because upstream packages published new releases, with
# no change to this repo at all. `kotlinStoreYarnLock` / `kotlinWasmStoreYarnLock`
# then fail the Release workflow's `web` job with "Lock file was changed. Run
# the `kotlinUpgradeYarnLock` task to actualize lock file".
#
# Running the same check here, on a schedule and on every push to main, means
# drift is caught the week it happens (as a failed run + GitHub's failure
# email) instead of during a release, where it blocks every platform.
#
# Fix on failure: regenerate BOTH locks against a cold cache (the JS one can
# silently stay UP-TO-DATE and only wasm gets fixed otherwise), then commit:
#   rm -rf build/js .gradle/configuration-cache
#   ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock --rerun-tasks --no-configuration-cache

on:
  push:
    branches:
      - main
    paths:
      - 'kotlin-js-store/**'
      - '**/package.json'
      - '**/build.gradle.kts'

  schedule:
    # Mondays 06:00 UTC — catches drift from upstream npm releases even when
    # nothing in this repo changed.
    - cron: '0 6 * * 1'

  workflow_dispatch:

permissions:
  contents: read

env:
  # Required at Gradle configuration time by sharedUI/build.gradle.kts's
  # BuildConfig block — same as release.yml.
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}

  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.configuration-cache=true

jobs:
  check:
    name: Verify yarn.lock is in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fails with "Lock file was changed. Run the `kotlinUpgradeYarnLock`
      # task to actualize lock file" if a fresh resolve no longer matches the
      # committed lock — the same check the Release web job runs, in
      # isolation and without a full web build.
      - name: Check kotlin-js-store/yarn.lock is up to date
        run: ./gradlew kotlinStoreYarnLock kotlinWasmStoreYarnLock --rerun-tasks --no-configuration-cache --stacktrace
